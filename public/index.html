<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Slither.io Optimized</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #0b0e14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white;
            user-select: none; -webkit-user-select: none;
        }
        canvas { display: block; touch-action: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        #menu {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 15, 25, 0.95); padding: 20px; border-radius: 20px;
            text-align: center; pointer-events: auto; border: 2px solid #00ffcc;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2); width: 90%; max-width: 400px;
        }
        #menu h1 { margin-top: 0; color: #00ffcc; font-size: 28px; text-transform: uppercase; letter-spacing: 2px; }
        input[type="text"] {
            width: 80%; padding: 12px; margin: 10px 0; border-radius: 10px;
            border: 1px solid #333; font-size: 16px; background: #1a1a1a; color: white; text-align: center;
        }
        .custom-section { margin: 10px 0; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 15px; }
        
        .snake-preview-container {
            display: flex; align-items: center; justify-content: center; margin: 10px 0;
            padding: 15px; background: #000; border-radius: 15px;
        }
        .preview-head {
            width: 35px; height: 28px; border-radius: 15px; background: #00ffcc;
        }
        .color-picker { display: flex; justify-content: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
        .color-option { width: 25px; height: 25px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }

        button#start-btn {
            background: linear-gradient(135deg, #00ffcc, #0099ff); color: black; border: none; padding: 12px;
            font-size: 18px; font-weight: bold; border-radius: 30px; cursor: pointer;
            width: 100%; text-transform: uppercase;
        }
        
        #leaderboard {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0, 0, 0, 0.6); padding: 10px; border-radius: 10px;
            width: 180px; font-size: 12px; backdrop-filter: blur(5px); pointer-events: none;
        }
        #leaderboard h2 { margin: 0 0 5px 0; font-size: 14px; color: #00ffcc; text-align: center; }
        #leaderboard table { width: 100%; }
        
        #minimap-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 120px; height: 120px; background: rgba(0, 0, 0, 0.6);
            border-radius: 50%; border: 1px solid #444; overflow: hidden;
        }
        #minimap { width: 100%; height: 100%; }

        #kill-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none;
            flex-direction: column; justify-content: center; align-items: center;
        }
        #kill-screen h2 { font-size: 40px; color: #ff3333; }

        /* Mobile Sprint Button */
        #sprint-btn {
            position: absolute; bottom: 40px; left: 40px;
            width: 80px; height: 80px; background: rgba(0, 255, 204, 0.3);
            border: 2px solid #00ffcc; border-radius: 50%;
            display: none; pointer-events: auto;
            justify-content: center; align-items: center;
            font-weight: bold; color: #00ffcc;
            -webkit-tap-highlight-color: transparent;
        }
        @media (max-width: 768px) {
            #sprint-btn { display: flex; }
            #leaderboard { width: 140px; top: 5px; right: 5px; }
            #minimap-container { width: 100px; height: 100px; bottom: 10px; right: 10px; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div id="menu">
            <h1>Slither IO</h1>
            <input type="text" id="nickname" placeholder="Nickname..." maxlength="12">
            
            <div class="custom-section">
                <div class="snake-preview-container">
                    <div class="preview-head" id="preview-head"></div>
                </div>
                <div class="color-picker" id="color-picker"></div>
            </div>
            
            <button id="start-btn">PLAY</button>
        </div>

        <div id="leaderboard">
            <h2>LEADERBOARD</h2>
            <table id="leaderboard-table"></table>
        </div>

        <div id="minimap-container">
            <canvas id="minimap"></canvas>
        </div>

        <div id="sprint-btn">BOOST</div>

        <div id="kill-screen">
            <h2>GAME OVER</h2>
            <p>Respawning in <span id="respawn-timer">3</span>...</p>
        </div>
    </div>

    <script src="client.js"></script>
    <script>
        // Additional mobile sprint button handling
        const sBtn = document.getElementById('sprint-btn');
        sBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if(me) me.isSprinting = true; });
        sBtn.addEventListener('touchend', (e) => { e.preventDefault(); if(me) me.isSprinting = false; });
    </script>
</body>
</html>
